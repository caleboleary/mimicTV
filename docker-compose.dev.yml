# Development container: this checkout bind-mounted, dependencies installed on first start, Vite and the
# service running with live reload. See docs/development.md.  docker compose -f docker-compose.dev.yml up -d
services:
  mimictv-dev:
    build:
      context: ./docker
      dockerfile: Dockerfile.dev
    container_name: mimictv-dev
    ports:
      - "5173:5173"   # app (Vite)
      - "8787:8787"   # service
    volumes:
      - .:/app
      - /path/to/media:/media:ro
      - /path/to/ersatztv-next:/next
    environment:
      - TZ=America/New_York
    restart: unless-stopped
