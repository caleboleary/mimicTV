# mimicTV dev container next to ErsatzTV Next, for testing on a real box (see docs/unraid.md).
# Adjust the three host paths for your machine.
services:
  mimictv:
    build:
      context: ./docker
      dockerfile: Dockerfile.dev
    container_name: mimictv-dev
    ports:
      - "5173:5173"   # app
      - "8787:8787"   # service (Next calls back here for live ad breaks)
    volumes:
      - /mnt/user/appdata/mimictv/repo:/app          # this repo
      - /mnt/user/appdata/mimictv/home:/root         # keeps Claude Code login and shell history
      - /mnt/user/Media:/media:ro                    # your media, same path Next sees
      - /mnt/user/appdata/ersatztv-next:/next        # published output; Next reads it as /config
    environment:
      - TZ=America/Chicago
    restart: unless-stopped

  ersatztv-next:
    # Next publishes no "latest" yet: only "develop" and one tag per commit SHA, on ghcr.io and
    # Docker Hub (ersatztv/next). Pin a SHA once a build has proven itself, e.g.
    #   ghcr.io/ersatztv/next:cbcd328e5c8243c5102fad097f62b1240760322e   (2026-08-29)
    image: ghcr.io/ersatztv/next:develop
    container_name: ersatztv-next
    ports:
      - "8410:8409"   # host 8410; Legacy ErsatzTV already owns 8409 on the box
    volumes:
      - /mnt/user/Media:/media:ro
      - /mnt/user/appdata/ersatztv-next:/config
    environment:
      - TZ=America/Chicago
    # Optional hardware transcoding, e.g. Intel Quick Sync:
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
