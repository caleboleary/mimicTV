# mimicTV next to ErsatzTV Next. Change the three host paths and the time zone, then: docker compose up -d
#
#   media      your library, read-only, mounted at the same path in both containers
#   next       the folder mimicTV publishes into and ErsatzTV Next reads as /config
#   ./data     mimicTV's state: rules, library, break decisions, checkpoints (back this up)
#
# Both containers need the same TZ: schedules are built in local time.
services:
  mimictv:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mimictv
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
      - /path/to/media:/media:ro
      - /path/to/ersatztv-next:/next
    environment:
      - TZ=America/New_York
    restart: unless-stopped

  ersatztv-next:
    # ErsatzTV Next publishes no "latest" tag yet: "develop" tracks the main branch; pin a commit SHA once a build has proven itself.
    image: ghcr.io/ersatztv/next:develop
    container_name: ersatztv-next
    ports:
      - "8409:8409"
    volumes:
      - /path/to/media:/media:ro
      - /path/to/ersatztv-next:/config
    environment:
      - TZ=America/New_York
    # Hardware transcoding, e.g. Intel Quick Sync:
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
